<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>No.8 掃除チェック</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:"Hiragino Sans","Yu Gothic UI",sans-serif;background:linear-gradient(160deg,#fff0f7,#f5eeff,#fff6e0);min-height:100vh;color:#3a2a3a;}
button,input{font-family:inherit;}
input{outline:none;}
button{cursor:pointer;}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{height:4px;width:4px;}
::-webkit-scrollbar-thumb{background:#f0d0e8;border-radius:4px;}
#app{min-height:100vh;}
.header{background:linear-gradient(90deg,#f7a8d0,#c8a8f7);position:sticky;top:0;z-index:20;box-shadow:0 2px 16px rgba(200,100,200,0.18);}
.header.pm{background:linear-gradient(90deg,#f7c87a,#f7a060);}
.header-inner{max-width:900px;margin:0 auto;padding:12px 16px 0;display:flex;justify-content:space-between;align-items:flex-start;}
.header-title{font-size:18px;font-weight:800;color:#fff;}

.month-nav{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.22);border-radius:20px;padding:6px 10px;}
.month-nav button{background:none;border:none;color:#fff;font-size:20px;padding:0 4px;line-height:1;}
.month-label{font-size:14px;font-weight:700;color:#fff;min-width:80px;text-align:center;}
.period-row{max-width:900px;margin:0 auto;display:flex;gap:8px;padding:10px 16px 4px;}
.period-btn{flex:1;border:none;border-radius:20px;padding:8px 0;font-weight:700;font-size:13px;background:rgba(255,255,255,0.2);color:rgba(255,255,255,0.85);}
.period-btn.active{background:rgba(255,255,255,0.95);color:#d060a0;}
.period-btn.active.pm{color:#c07800;}
.tab-row{max-width:900px;margin:0 auto;display:flex;padding:4px 16px 0;}
.tab-btn{background:none;border:none;color:rgba(255,255,255,0.65);font-weight:600;font-size:14px;padding:8px 18px;border-bottom:3px solid transparent;}
.tab-btn.active{color:#fff;border-bottom:3px solid #fff;}
.main{max-width:900px;margin:0 auto;padding:16px 12px 60px;}
.shop-row{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;}
.shop-row::-webkit-scrollbar{display:none;}
.shop-btn{padding:7px 14px;border-radius:14px;border:1.5px solid #e8c8e8;background:#fff5fa;color:#b06090;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;}
.shop-btn.active{border-color:transparent;color:#fff;background:linear-gradient(90deg,#f7a8d0,#c8a8f7);}

.summary-row{display:flex;gap:12px;margin-bottom:14px;}
.summary-card{flex:1;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 12px rgba(200,120,200,0.1);}
.summary-num{font-size:26px;font-weight:800;line-height:1;}
.summary-label{font-size:11px;color:#c090c0;font-weight:600;margin-bottom:4px;}
.pct-bar-wrap{height:8px;background:#f0e0f0;border-radius:4px;overflow:hidden;margin-top:6px;}
.pct-bar-fill{height:100%;border-radius:4px;transition:width .4s;}
.grid-wrap{display:flex;background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(200,120,200,0.1);overflow:hidden;margin-bottom:10px;}
.grid-left{flex-shrink:0;min-width:110px;max-width:130px;border-right:1.5px solid #f0e0f0;}
.grid-corner{height:52px;display:flex;align-items:flex-end;padding:0 8px 8px;font-size:10px;color:#c0a0c0;font-weight:600;border-bottom:1.5px solid #f0e0f0;background:#fdf5ff;}
.grid-area-cell{height:44px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:#7050a0;border-bottom:1px solid #f8f0f8;cursor:pointer;justify-content:space-between;overflow:hidden;}
.grid-total-label{height:36px;display:flex;align-items:center;padding:0 8px;font-size:10px;color:#c090c0;font-weight:600;border-top:1.5px solid #f0e0f0;background:#fdf5ff;}
.grid-right{flex:1;overflow-x:auto;scrollbar-width:thin;}
.day-header-row{display:flex;border-bottom:1.5px solid #f0e0f0;background:#fdf5ff;}
.day-header-cell{min-width:38px;width:38px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 8px;font-size:13px;font-weight:700;color:#7050a0;flex-shrink:0;border-right:1px solid #f8f0f8;}
.day-header-cell.mon{background:#f5f0ff;color:#bbb;}
.day-header-cell.sat{color:#5b7fe8;}
.day-header-cell.sun{color:#e85b7f;}
.day-header-cell.today-am{background:linear-gradient(180deg,#fce8f3,#f0e8ff);color:#c060a0;}
.day-header-cell.today-pm{background:linear-gradient(180deg,#fff3d0,#fff0e8);color:#c07800;}
.data-row{display:flex;border-bottom:1px solid #f8f0f8;}
.data-cell{min-width:38px;width:38px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-right:1px solid #f8f0f8;}
.data-cell.mon{background:#f8f5ff;}

.checker-badge{font-size:8px;width:34px;height:22px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;padding:0 2px;color:#fff;}
.total-row{display:flex;background:#fdf5ff;border-top:1.5px solid #f0e0f0;}
.total-cell{min-width:38px;width:38px;height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border-right:1px solid #f0e8f8;cursor:pointer;font-weight:700;}
.total-cell.mon{background:#f8f5ff;cursor:default;}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(200,120,200,0.08);}
.card-title{font-weight:700;font-size:14px;color:#a040a0;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#fdf0f8;padding:8px 10px;border:1px solid #f0d8ec;font-weight:700;color:#a04080;text-align:left;}
td{padding:8px 10px;border:1px solid #f5eef5;color:#555;vertical-align:middle;}
.overlay{position:fixed;inset:0;background:rgba(60,20,80,0.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 -4px 40px rgba(180,100,200,0.2);}
.sheet-handle{width:36px;height:4px;background:#e0d0e8;border-radius:2px;margin:12px auto 0;}
.sheet-header{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 20px 14px;border-bottom:1.5px solid #f0e0f0;flex-shrink:0;}
.sheet-title{font-size:17px;font-weight:800;color:#5030a0;}
.sheet-close{background:#f5eeff;border:none;border-radius:50%;width:32px;height:32px;font-size:16px;color:#a060c0;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sheet-body{overflow-y:auto;flex:1;}
.prog-bar-wrap{padding:12px 20px;border-bottom:1px solid #f0e8f8;}
.area-list-item{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid #f5eef5;cursor:pointer;gap:12px;}
.area-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.area-name{font-size:15px;font-weight:600;flex:1;}
.area-badge{border-radius:16px;padding:4px 12px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;}
.area-arrow{color:#d0c0d8;font-size:18px;}
.picker-staff-grid{display:flex;flex-wrap:wrap;gap:10px;padding:16px 24px;}
.staff-pick-btn{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:30px;border:1.5px solid #e8e0f0;background:#fff;color:#555;font-size:15px;font-weight:400;min-width:90px;}
.staff-pick-btn.checked{color:#fff;font-weight:700;}
.staff-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.undo-btn{width:calc(100% - 48px);padding:14px;border-radius:14px;border:1.5px dashed #e0c0d8;background:#fff;color:#c060a0;font-size:14px;font-weight:600;margin:0 24px;}
.input-style{border:1.5px solid #e8d0e8;border-radius:10px;padding:8px 12px;font-size:14px;color:#3a2a3a;background:#fdf8ff;width:100%;}
.chip{padding:5px 12px;border-radius:16px;border:1.5px solid #e8c0d8;background:#fff5fa;color:#b06090;font-size:12px;font-weight:600;}
.chip.active{background:linear-gradient(90deg,#f7a8d0,#c8a8f7);color:#fff;border-color:transparent;}
.btn-primary{background:linear-gradient(90deg,#f7a8d0,#c8a8f7);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:700;}
.btn-sec{background:#f5e8fc;color:#a060c0;border:1.5px solid #d8b8f0;border-radius:10px;padding:7px 14px;font-size:13px;font-weight:700;}
.btn-del{background:#fff0f4;color:#e06080;border:1.5px solid #f0c8d0;border-radius:8px;padding:7px 10px;font-size:13px;}
.save-banner{background:linear-gradient(90deg,#f0e8ff,#fce8f3);border:1.5px solid #e0c8f0;border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:8px;font-size:12px;color:#8050a0;font-weight:600;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#f7a8d0,#c8a8f7);color:#fff;border-radius:20px;padding:10px 24px;font-weight:700;font-size:14px;z-index:999;pointer-events:none;white-space:nowrap;}
.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.spinner{width:44px;height:44px;border:4px solid #f0d0e8;border-top-color:#c060a0;border-radius:50%;animation:sp 0.8s linear infinite;}
pre{font-family:monospace;font-size:13px;line-height:1.8;color:#444;white-space:pre-wrap;word-break:break-all;}
.idx{min-width:22px;text-align:center;color:#c090c0;font-weight:700;font-size:13px;}

/* ── スプラッシュ画面 ─────────────────────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes shimmerLine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
#splash{
  position:fixed;inset:0;z-index:1000;
  background:#fafafa;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 0.6s ease, transform 0.6s ease;
  cursor:pointer;
  -webkit-user-select:none;user-select:none;
}
#splash.hide{opacity:0;transform:scale(1.04);pointer-events:none;}
.splash-bg{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 50% -10%, rgba(247,168,208,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 100% 100%, rgba(200,168,247,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 0% 80%, rgba(247,200,200,0.08) 0%, transparent 60%);
}
.splash-inner{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  gap:0;
  animation:scaleIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
}
.splash-logo-wrap{
  width:96px;height:96px;
  background:#fff;
  border-radius:28px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 40px rgba(200,100,180,0.12), 0 2px 8px rgba(0,0,0,0.06);
  margin-bottom:28px;
  position:relative;
  overflow:hidden;
}
.splash-logo-wrap::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,0.7) 50%,transparent 60%);
  animation:shimmerLine 2.4s ease-in-out infinite;
}
.splash-scissors{font-size:44px;line-height:1;}
.splash-brand{
  font-size:11px;letter-spacing:4px;color:#c0a8c0;font-weight:500;
  margin-bottom:10px;
  animation:fadeUp 0.8s 0.15s cubic-bezier(0.16,1,0.3,1) both;
}
.splash-title{
  font-size:32px;font-weight:800;color:#2a1a2a;letter-spacing:-0.5px;
  margin-bottom:6px;
  animation:fadeUp 0.8s 0.25s cubic-bezier(0.16,1,0.3,1) both;
}
.splash-title span{
  background:linear-gradient(135deg,#e890c8,#a870e0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.splash-sub{
  font-size:13px;color:#b090b0;font-weight:400;letter-spacing:0.3px;
  margin-bottom:52px;
  animation:fadeUp 0.8s 0.35s cubic-bezier(0.16,1,0.3,1) both;
}
.splash-divider{
  width:1px;height:40px;
  background:linear-gradient(to bottom,transparent,#e0c8e0,transparent);
  margin-bottom:52px;
  animation:fadeUp 0.8s 0.4s both;
}
.splash-tap{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:fadeUp 0.8s 0.5s cubic-bezier(0.16,1,0.3,1) both;
}
.splash-tap-circle{
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,#f7a8d0,#c8a8f7);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(200,100,200,0.25);
  font-size:22px;
  transition:transform 0.2s,box-shadow 0.2s;
}
#splash:active .splash-tap-circle{
  transform:scale(0.93);
  box-shadow:0 3px 12px rgba(200,100,200,0.2);
}
.splash-tap-label{
  font-size:11px;letter-spacing:3px;color:#c0a0c0;font-weight:500;
  animation:pulse 2.4s ease-in-out 1s infinite;
}
.splash-version{
  position:absolute;bottom:32px;
  font-size:10px;color:#d0c0d0;letter-spacing:1px;
}
</style>
</head>
<body>

<div id="splash" onclick="startApp()">
  <div class="splash-bg"></div>
  <div class="splash-inner">
    <div class="splash-logo-wrap">
      <div class="splash-scissors">✂</div>
    </div>
    <div class="splash-brand">SALON CLEAN CHECK</div>
    <div class="splash-title">No.<span>8</span></div>
    <div class="splash-sub">掃除チェック管理システム</div>
    <div class="splash-divider"></div>
    <div class="splash-tap">
      <div class="splash-tap-circle">→</div>
      <div class="splash-tap-label">TAP TO START</div>
    </div>
  </div>
  <div class="splash-version">ver 2.0</div>
</div>
<div id="app"><div class="loading"><div style="font-size:40px">✂</div><div style="color:#c060a0;font-weight:700">読み込み中...</div><div class="spinner"></div></div></div>

<script>
// ─── データ ───────────────────────────────────────────────────────────────────
var SHOPS0=["霧島店","丸山店","3号店","4号店","5号店","6号店","7号店","8号店"];
var STAFF0=[["霧島スタッフ1","霧島スタッフ2","霧島スタッフ3","霧島スタッフ4","","","",""],["丸山スタッフ1","丸山スタッフ2","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""]];
var AREAS0=[{name:"カットフロアー",items:["床掃き","床拭き","鏡拭き","セット椅子清掃","カウンター拭き"]},{name:"シャンプーエリア",items:["シャンプー台洗い","シャンプールーム整理","シャンプー補充","イヤーカバー洗い"]},{name:"ラボ",items:["ラボ整理","シンク掃除","カラーパーマ準備"]},{name:"バックルーム",items:["バックルーム整理","バックルームシンク","クロス洗濯"]},{name:"待合・受付",items:["待合整頓","雑誌整理","カウンター拭き","伝票準備"]},{name:"トイレ",items:["お客様トイレ","スタッフトイレ"]},{name:"外・駐車場",items:["駐車場清掃","店前掃き","ゴミ捨て場"]},{name:"環境整備",items:["環境整備サイン"]}];
var TASKS_PM0=["イヤーカバー","シャンプー台洗い","シャンプールーム整理","シャンプー補充","クロス洗濯","ラボ整理・シンク","雑誌整理","バックルーム整理","バックルームシンク","カラーパーマ準備","カルテ・伝票準備","環境整備サイン"];
var COLORS=["#e8405a","#f0921e","#2db060","#2090d0","#7060d0","#e07030","#c030a0","#30a898"];
var DOW=["日","月","火","水","木","金","土"];

// ─── ストレージ ───────────────────────────────────────────────────────────────
function lsGet(k){try{var v=localStorage.getItem("no8_"+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem("no8_"+k,JSON.stringify(v));}catch(e){}}

// ─── 状態 ─────────────────────────────────────────────────────────────────────
var now=new Date();
var S={
  year:now.getFullYear(), month:now.getMonth()+1,
  tab:"check", si:0, period:"am",
  shops:SHOPS0.slice(), staff:JSON.parse(JSON.stringify(STAFF0)),
  areasAm:JSON.parse(JSON.stringify(AREAS0)),
  tasksPm:TASKS_PM0.slice(),
  emailTo:"",
  checks:{am:{},pm:{}},
  detailDay:null, editAi:null,
  picker:null,    showPreview:false,
  toast:null,     toastTimer:null
};

// ─── ヘルパー ─────────────────────────────────────────────────────────────────
function daysInMonth(y,m){return new Date(y,m,0).getDate();}
function dow(y,m,d){return new Date(y,m-1,d).getDay();}
function isMon(y,m,d){return dow(y,m,d)===1;}
function pad2(n){return n<10?"0"+n:String(n);}
function dateStr(y,m,d){return y+"-"+pad2(m)+"-"+pad2(d);}
function todayStr(){var n=new Date();return dateStr(n.getFullYear(),n.getMonth()+1,n.getDate());}
function getC(period,ds,si){
  var c=S.checks;
  if(!c||!c[period]||!c[period][ds]||!c[period][ds][si])return {};
  return c[period][ds][si]||{};
}
function activeStaff(){return (S.staff[S.si]||[]).filter(function(s){return s&&s.trim();});}
function pct(done,total){return total?Math.round(done/total*100):0;}

// 達成計算
function amDone(d,shopI){
  if(shopI===undefined)shopI=S.si;
  var ds=dateStr(S.year,S.month,d);
  var c=getC("am",ds,shopI);
  var done=0;
  for(var ai=0;ai<S.areasAm.length;ai++){if(c[String(ai)])done++;}
  return {done:done,total:S.areasAm.length};
}
function pmDone(d,shopI){
  if(shopI===undefined)shopI=S.si;
  var ds=dateStr(S.year,S.month,d);
  var c=getC("pm",ds,shopI);
  var done=S.tasksPm.filter(function(_,i){return c[String(i)];}).length;
  return {done:done,total:S.tasksPm.length};
}
function amMonth(shopI){
  if(shopI===undefined)shopI=S.si;
  var done=0,total=0,days=daysInMonth(S.year,S.month);
  for(var d=1;d<=days;d++){if(isMon(S.year,S.month,d))continue;var r=amDone(d,shopI);done+=r.done;total+=r.total;}
  return {done:done,total:total};
}
function pmMonth(shopI){
  if(shopI===undefined)shopI=S.si;
  var done=0,total=0,days=daysInMonth(S.year,S.month);
  for(var d=1;d<=days;d++){if(isMon(S.year,S.month,d))continue;var r=pmDone(d,shopI);done+=r.done;total+=r.total;}
  return {done:done,total:total};
}
function curDone(d){return S.period==="am"?amDone(d):pmDone(d);}
function curMonth(){return S.period==="am"?amMonth():pmMonth();}

// toggle
function toggle(period,ds,shopI,key,name){
  if(!S.checks[period])S.checks[period]={};
  if(!S.checks[period][ds])S.checks[period][ds]={};
  if(!S.checks[period][ds][shopI])S.checks[period][ds][shopI]={};
  var cur=S.checks[period][ds][shopI][key];
  S.checks[period][ds][shopI][key]=(cur===name)?null:name;
  lsSet("checks4",S.checks);
  render();
}

// toast
function showToast(msg){
  if(S.toastTimer)clearTimeout(S.toastTimer);
  S.toast=msg;
  S.toastTimer=setTimeout(function(){S.toast=null;render();},2500);
  render();
}

// レポート生成
function buildReport(){
  var days=daysInMonth(S.year,S.month);
  var r="【"+S.year+"年"+S.month+"月 掃除チェック集計】\n";
  r+="送信日時: "+new Date().toLocaleString("ja-JP")+"\n";
  r+="━━━━━━━━━━━━━━━━━━━━━━\n\n";
  S.shops.forEach(function(sh,shopI){
    var am=amMonth(shopI),pm=pmMonth(shopI);

// ─── HTML生成 ─────────────────────────────────────────────────────────────────
function h(tag,attrs,children){
  var el=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(function(k){
    if(k==="style"&&typeof attrs[k]==="object"){
      Object.assign(el.style,attrs[k]);
    }else if(k.startsWith("on")){
      el.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    }else if(k==="className"){
      el.className=attrs[k];
    }else if(k==="value"&&(tag==="input"||tag==="textarea")){
      el.value=attrs[k];
      // do not setAttribute for value
    }else{
      el.setAttribute(k,attrs[k]);
    }
  });
  if(children){
    if(!Array.isArray(children))children=[children];
    children.forEach(function(c){
      if(c===null||c===undefined)return;
      if(typeof c==="string"||typeof c==="number"){
        el.appendChild(document.createTextNode(String(c)));
      }else{
        el.appendChild(c);
      }
    });
  }
  return el;
}
function t(text){return document.createTextNode(String(text||""));}
function div(cls,children,style){
  var el=document.createElement("div");
  if(cls)el.className=cls;
  if(style)Object.assign(el.style,style);
  if(children){
    if(!Array.isArray(children))children=[children];
    children.forEach(function(c){
      if(c===null||c===undefined)return;
      if(typeof c==="string"||typeof c==="number")el.appendChild(document.createTextNode(String(c)));
      else el.appendChild(c);
    });
  }
  return el;
}

    // スタッフ
    var sc2=div("card");sc2.appendChild(div("card-title","スタッフ名（店舗ごとに最大8名）"));
    var shopChips=document.createElement("div");shopChips.style.cssText="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px";
    S.shops.forEach(function(sh,i){
      var btn=h("button",{},sh);btn.className="chip"+(S.si===i?" active":"");
      btn.addEventListener("click",function(){S.si=i;render();});shopChips.appendChild(btn);
    });
    sc2.appendChild(shopChips);
    var staffBox=document.createElement("div");staffBox.style.cssText="background:#fdf5ff;border-radius:10px;padding:12px 14px";
    var slabel=document.createElement("div");slabel.style.cssText="font-size:12px;color:#c080c0;font-weight:600;margin-bottom:10px";slabel.textContent=S.shops[S.si]+" のスタッフ";
    staffBox.appendChild(slabel);
    for(var ni=0;ni<8;ni++){
      var row2=document.createElement("div");row2.style.cssText="display:flex;gap:8px;align-items:center;margin-bottom:8px";
      var idx2=document.createElement("span");idx2.className="idx";idx2.textContent=ni+1;
      var sinp=h("input",{type:"text",placeholder:"スタッフ"+(ni+1)+"（空欄は非表示）"});
      sinp.className="input-style";sinp.style.flex="1";sinp.value=(S.staff[S.si]||[])[ni]||"";
      (function(ni2){sinp.addEventListener("input",function(){if(!S.staff[S.si])S.staff[S.si]=[];S.staff[S.si][ni2]=this.value;lsSet("staff2",S.staff);});})(ni);
      row2.appendChild(idx2);row2.appendChild(sinp);staffBox.appendChild(row2);
    }
    sc2.appendChild(staffBox);main.appendChild(sc2);

    // 朝の掃除場所
    var sc3=div("card");
    var sc3top=document.createElement("div");sc3top.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px";
    sc3top.appendChild(div("card-title","朝の掃除場所（タップで内容編集）"));
    var addABtn=h("button",{},"＋追加");addABtn.className="btn-sec";
    addABtn.addEventListener("click",function(){S.areasAm.push({name:"新しい場所",items:[""]});lsSet("areasAm",S.areasAm);render();});
    sc3top.appendChild(addABtn);sc3.appendChild(sc3top);
    S.areasAm.forEach(function(area,i){
      var row3=document.createElement("div");row3.style.cssText="display:flex;gap:8px;align-items:center;margin-bottom:8px";
      var idx3=document.createElement("span");idx3.className="idx";idx3.textContent=i+1;
      var abtn=h("button",{},area.name+"（"+area.items.length+"項目）");
      abtn.style.cssText="border:1.5px solid #e8d0e8;border-radius:10px;padding:8px 12px;font-size:14px;color:#7050a0;background:#fdf5ff;flex:1;text-align:left;cursor:pointer";
      (function(i2){abtn.addEventListener("click",function(){S.editAi=i2;render();});})(i);
      var delBtn=h("button",{},"✕");delBtn.className="btn-del";
      (function(i2){delBtn.addEventListener("click",function(){S.areasAm.splice(i2,1);lsSet("areasAm",S.areasAm);render();});})(i);
      row3.appendChild(idx3);row3.appendChild(abtn);row3.appendChild(delBtn);sc3.appendChild(row3);
    });
    main.appendChild(sc3);

    // 夕方
    var sc4=div("card");
    var sc4top=document.createElement("div");sc4top.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px";
    sc4top.appendChild(div("card-title","夕方の掃除箇所"));
    var addPBtn=h("button",{},"＋追加");addPBtn.className="btn-sec";
    addPBtn.addEventListener("click",function(){S.tasksPm.push("");lsSet("tasksPm",S.tasksPm);render();});
    sc4top.appendChild(addPBtn);sc4.appendChild(sc4top);
    S.tasksPm.forEach(function(t,i){
      var row4=document.createElement("div");row4.style.cssText="display:flex;gap:8px;align-items:center;margin-bottom:8px";
      var idx4=document.createElement("span");idx4.className="idx";idx4.textContent=i+1;
      var tinp=h("input",{type:"text"});tinp.className="input-style";tinp.style.flex="1";tinp.value=t;
      (function(i2){tinp.addEventListener("input",function(){S.tasksPm[i2]=this.value;lsSet("tasksPm",S.tasksPm);});})(i);
      var tdel=h("button",{},"✕");tdel.className="btn-del";
      (function(i2){tdel.addEventListener("click",function(){S.tasksPm.splice(i2,1);lsSet("tasksPm",S.tasksPm);render();});})(i);
      row4.appendChild(idx4);row4.appendChild(tinp);row4.appendChild(tdel);sc4.appendChild(row4);
    });
    main.appendChild(sc4);

    // メール
    var sc5=div("card");sc5.appendChild(div("card-title","レポート送信先メール"));
    var einp=h("input",{type:"email",placeholder:"例: manager@salon.co.jp"});
    einp.className="input-style";einp.value=S.emailTo;
    einp.addEventListener("input",function(){S.emailTo=this.value;lsSet("email",S.emailTo);});
    sc5.appendChild(einp);main.appendChild(sc5);
  }

  root.appendChild(main);

  // ─── 掃除場所編集シート ────────────────────────────────────────────────────
  if(S.editAi!==null&&S.areasAm[S.editAi]){
    var area=S.areasAm[S.editAi];
    var ov=div("overlay");
    ov.addEventListener("click",function(){S.editAi=null;render();});
    var sheet=div("sheet");
    sheet.addEventListener("click",function(e){e.stopPropagation();});
    sheet.appendChild(div("sheet-handle"));
    var sh2=div("sheet-header");
    sh2.appendChild(div("sheet-title","掃除場所の編集"));
    var sc=h("button",{},"✕");sc.className="sheet-close";sc.addEventListener("click",function(){S.editAi=null;render();});
    sh2.appendChild(sc);sheet.appendChild(sh2);
    var sb=div("sheet-body");
    sb.style.padding="16px 20px";
    var nlabel=document.createElement("div");nlabel.style.cssText="font-size:12px;color:#c080c0;font-weight:600;margin-bottom:6px";nlabel.textContent="場所名";
    var ninp=h("input",{type:"text"});ninp.className="input-style";ninp.style.marginBottom="16px";ninp.value=area.name;
    ninp.addEventListener("input",function(){S.areasAm[S.editAi].name=this.value;lsSet("areasAm",S.areasAm);});
    sb.appendChild(nlabel);sb.appendChild(ninp);
    var ilabel=document.createElement("div");ilabel.style.cssText="font-size:12px;color:#c080c0;font-weight:600;margin-bottom:8px";ilabel.textContent="掃除内容";
    sb.appendChild(ilabel);
    area.items.forEach(function(item,ii){
      var irow=document.createElement("div");irow.style.cssText="display:flex;gap:8px;align-items:center;margin-bottom:8px";
      var iidx=document.createElement("span");iidx.className="idx";iidx.textContent=ii+1;
      var iinp=h("input",{type:"text",placeholder:"掃除内容を入力"});iinp.className="input-style";iinp.style.flex="1";iinp.value=item;
      (function(ii2){iinp.addEventListener("input",function(){S.areasAm[S.editAi].items[ii2]=this.value;lsSet("areasAm",S.areasAm);});})(ii);
      var idel=h("button",{},"✕");idel.className="btn-del";
      (function(ii2){idel.addEventListener("click",function(){S.areasAm[S.editAi].items.splice(ii2,1);lsSet("areasAm",S.areasAm);render();});})(ii);
      irow.appendChild(iidx);irow.appendChild(iinp);irow.appendChild(idel);sb.appendChild(irow);
    });
    var addIBtn=h("button",{},"＋ 掃除内容を追加");addIBtn.className="btn-sec";addIBtn.style.cssText="width:100%;margin-top:4px;padding:10px;";
    addIBtn.addEventListener("click",function(){S.areasAm[S.editAi].items.push("");lsSet("areasAm",S.areasAm);render();});
    sb.appendChild(addIBtn);sheet.appendChild(sb);ov.appendChild(sheet);root.appendChild(ov);
  }

  // ─── 詳細シート（日付タップ）────────────────────────────────────────────────
  if(S.detailDay!==null){
    var dDs=dateStr(S.year,S.month,S.detailDay);
    var dAmC=getC("am",dDs,S.si);
    var dPmC=getC("pm",dDs,S.si);
    var dHoliday=isMon(S.year,S.month,S.detailDay);
    var ov2=div("overlay");
    ov2.addEventListener("click",function(){S.detailDay=null;S.picker=null;render();});
    var sheet2=div("sheet");
    sheet2.addEventListener("click",function(e){e.stopPropagation();});
    sheet2.appendChild(div("sheet-handle"));
    var sh3=div("sheet-header",[
      (function(){
        var d=document.createElement("div");
        var sub2=document.createElement("div");sub2.style.cssText="font-size:11px;color:#c080c0;font-weight:600";
        sub2.textContent=S.shops[S.si]+"　"+(isPm?"夕方の掃除":"朝の掃除");
        var title2=div("sheet-title",S.month+"月"+S.detailDay+"日（"+DOW[dow(S.year,S.month,S.detailDay)]+"）");
        d.appendChild(sub2);d.appendChild(title2);return d;
      })()
    ]);
    var sc2b=h("button",{},"✕");sc2b.className="sheet-close";
    sc2b.addEventListener("click",function(){S.detailDay=null;S.picker=null;render();});
    sh3.appendChild(sc2b);sheet2.appendChild(sh3);

    if(dHoliday){
      var hd=document.createElement("div");hd.style.cssText="text-align:center;padding:32px 0";
      hd.innerHTML="<div style='font-size:36px'>🌙</div><div style='font-weight:700;font-size:16px;margin-top:8px;color:#9070b0'>定休日</div>";
      sheet2.appendChild(hd);
    }else{
      var sb2=div("sheet-body");
      // 進捗バー
      var dR=isPm?pmDone(S.detailDay):amDone(S.detailDay);
      var dP=pct(dR.done,dR.total);
      var pb=div("prog-bar-wrap");pb.style.padding="12px 20px";pb.style.borderBottom="1px solid #f0e8f8";
      var pbtop=document.createElement("div");pbtop.style.cssText="display:flex;justify-content:space-between;margin-bottom:6px";
      var pbl=document.createElement("span");pbl.style.cssText="font-size:13px;color:#9070b0;font-weight:600";pbl.textContent="進捗";
      var pbr=document.createElement("span");pbr.style.cssText="font-size:14px;font-weight:700;color:"+col;pbr.textContent=dR.done+"/"+dR.total+" "+dP+"%";
      pbtop.appendChild(pbl);pbtop.appendChild(pbr);pb.appendChild(pbtop);
      var pbw=div("pct-bar-wrap");var pbf=div("pct-bar-fill");pbf.style.background=fill;pbf.style.width=dP+"%";pbw.appendChild(pbf);pb.appendChild(pbw);
      if(dR.done===dR.total&&dR.total>0){var done2=document.createElement("div");done2.style.cssText="text-align:center;color:"+col+";font-weight:700;margin-top:8px";done2.textContent="完了！";pb.appendChild(done2);}
      sb2.appendChild(pb);

      var listItems2=isPm?S.tasksPm:S.areasAm;
      listItems2.forEach(function(item,idx){
        var nm=isPm?item:item.name;
        var checker=isPm?(dPmC[String(idx)]||null):(dAmC[String(idx)]||null);
        var sc2c=checker?COLORS[ast.indexOf(checker)%COLORS.length]:"#e0d0e8";
        var li=div("area-list-item");
        var dot=div("area-dot");dot.style.background=sc2c;
        var aname=div("area-name",nm);aname.style.color=checker?"#6040a0":"#444";
        li.appendChild(dot);li.appendChild(aname);
        if(checker){var ab=div("area-badge",checker);ab.style.background=sc2c;li.appendChild(ab);}
        else{var arr=div("area-arrow","›");li.appendChild(arr);}
        (function(idx2,nm2,checker2){
          li.addEventListener("click",function(){
            S.picker={ai:isPm?null:idx2,pm:isPm,ti:isPm?idx2:null,selDs:dDs,checker:checker2,label:nm2,day:S.detailDay};
            render();
          });
        })(idx,nm,checker);
        sb2.appendChild(li);
      });
      sheet2.appendChild(sb2);
    }
    ov2.appendChild(sheet2);root.appendChild(ov2);
  }

  // ─── スタッフ選択ピッカー ──────────────────────────────────────────────────
  if(S.picker!==null){
    var pk=S.picker;
    var pkChecker=pk.checker||null;
    var ov3=div("overlay");ov3.style.zIndex="60";
    ov3.addEventListener("click",function(){S.picker=null;render();});
    var pkSheet=div("sheet");pkSheet.style.paddingBottom="32px";
    pkSheet.addEventListener("click",function(e){e.stopPropagation();});
    pkSheet.appendChild(div("sheet-handle"));
    var pkh=document.createElement("div");pkh.style.cssText="padding:20px 24px 4px";
    var pktitle=document.createElement("div");pktitle.style.cssText="font-size:18px;font-weight:800;color:#5030a0";
    pktitle.textContent=(pk.label||"")+"　"+S.month+"/"+pk.day;
    var pksub=document.createElement("div");pksub.style.cssText="font-size:13px;color:#b090c0;margin-top:4px";pksub.textContent="担当したスタッフを選んでください";
    pkh.appendChild(pktitle);pkh.appendChild(pksub);pkSheet.appendChild(pkh);
    var pkGrid=div("picker-staff-grid");
    ast.forEach(function(s,idx){
      var sc3b=COLORS[idx%COLORS.length];
      var isChecked=(pkChecker===s);
      var btn=div("staff-pick-btn"+(isChecked?" checked":""));
      if(isChecked)btn.style.background=sc3b;
      btn.style.borderColor=isChecked?sc3b:"#e8e0f0";
      var dot=div("staff-dot");dot.style.background=isChecked?"rgba(255,255,255,0.7)":sc3b;
      var sname=document.createTextNode(s);
      btn.appendChild(dot);btn.appendChild(sname);
      (function(s2,pk2){
        btn.addEventListener("click",function(){
          var p3=pk2.pm?"pm":"am";
          var key=pk2.pm?String(pk2.ti):String(pk2.ai);
          toggle(p3,pk2.selDs,S.si,key,s2);
          S.picker=null;
        });
      })(s,pk);
      pkGrid.appendChild(btn);
    });
    pkSheet.appendChild(pkGrid);
    if(pkChecker){
      var undoWrap=document.createElement("div");undoWrap.style.cssText="padding:0 24px";
      var undoBtn=h("button",{},"未実施に戻す");undoBtn.className="undo-btn";
      (function(pk2,pkChecker2){
        undoBtn.addEventListener("click",function(){
          var p4=pk2.pm?"pm":"am";
          var key=pk2.pm?String(pk2.ti):String(pk2.ai);
          toggle(p4,pk2.selDs,S.si,key,pkChecker2);
          S.picker=null;
        });
      })(pk,pkChecker);
      undoWrap.appendChild(undoBtn);pkSheet.appendChild(undoWrap);
    }
    ov3.appendChild(pkSheet);root.appendChild(ov3);
  }

  // ─── メールプレビュー ────────────────────────────────────────────────────
  if(S.showPreview){
    var ov4=div("overlay");ov4.style.zIndex="70";
    ov4.addEventListener("click",function(){S.showPreview=false;render();});
    var pvSheet=div("sheet");pvSheet.style.maxHeight="88vh";
    pvSheet.addEventListener("click",function(e){e.stopPropagation();});
    pvSheet.appendChild(div("sheet-handle"));
    var pvh=div("sheet-header",[
      (function(){
        var d=document.createElement("div");
        var pt=div("sheet-title","メール内容プレビュー");
        var ps=document.createElement("div");ps.style.cssText="font-size:12px;color:#c090c0;margin-top:2px";ps.textContent="月末20:00に自動送信されます";
        d.appendChild(pt);d.appendChild(ps);return d;
      })()
    ]);
    var pvc=h("button",{},"✕");pvc.className="sheet-close";
    pvc.addEventListener("click",function(){S.showPreview=false;render();});
    pvh.appendChild(pvc);pvSheet.appendChild(pvh);
    var pvb=div("sheet-body");pvb.style.padding="16px 20px";pvb.style.overflowY="auto";
    var subjBox=document.createElement("div");
    subjBox.style.cssText="background:#f8f4ff;border-radius:12px;padding:14px 16px;margin-bottom:14px";
    var sl=document.createElement("div");sl.style.cssText="font-size:11px;color:#a080c0;font-weight:600;margin-bottom:4px";sl.textContent="件名";
    var sv=document.createElement("div");sv.style.cssText="font-size:14px;font-weight:700;color:#5030a0";sv.textContent=S.year+"年"+S.month+"月 掃除チェック集計";
    subjBox.appendChild(sl);subjBox.appendChild(sv);pvb.appendChild(subjBox);
    var bodyBox=document.createElement("div");
    bodyBox.style.cssText="background:#fafafa;border-radius:12px;padding:14px 16px;border:1px solid #f0e0f0";
    var bl2=document.createElement("div");bl2.style.cssText="font-size:11px;color:#a080c0;font-weight:600;margin-bottom:8px";bl2.textContent="本文";
    var bv=document.createElement("pre");bv.textContent=buildReport();
    bodyBox.appendChild(bl2);bodyBox.appendChild(bv);pvb.appendChild(bodyBox);
    pvSheet.appendChild(pvb);
    var pvFooter=document.createElement("div");pvFooter.style.cssText="padding:16px 20px;border-top:1px solid #f0e0f0;display:flex;gap:8px;flex-shrink:0";
    var closeBtn2=h("button",{},"閉じる");closeBtn2.className="btn-sec";closeBtn2.style.cssText+="flex:1;padding:12px 0";
    closeBtn2.addEventListener("click",function(){S.showPreview=false;render();});
    var sendBtn2=h("button",{},"今すぐ送信");sendBtn2.className="btn-primary";sendBtn2.style.cssText+="flex:1;padding:12px 0";
    sendBtn2.addEventListener("click",function(){
      var r=buildReport();var sub=encodeURIComponent(S.year+"年"+S.month+"月 掃除チェック集計");
      window.open("mailto:"+S.emailTo+"?subject="+sub+"&body="+encodeURIComponent(r));
      S.showPreview=false;showToast("メールアプリを開きました");
    });
    pvFooter.appendChild(closeBtn2);pvFooter.appendChild(sendBtn2);pvSheet.appendChild(pvFooter);
    ov4.appendChild(pvSheet);root.appendChild(ov4);
  }

  // トースト
  if(S.toast){
    var toast=div("toast",S.toast);root.appendChild(toast);
  }

  // DOM更新
  var old=document.getElementById("app");
  old.parentNode.replaceChild(root,old);

  // グリッドスクロール復元
  var gr2=root.querySelector(".grid-right");
  if(gr2)gr2.scrollLeft=scrollLeftPos;
  // 今日にスクロール（初回のみ）
  if(scrollLeftPos===0&&gr2){
    var todayEl=gr2.querySelector(".today-am,.today-pm");
    if(todayEl)todayEl.scrollIntoView({behavior:"smooth",inline:"center"});
  }
}

// ─── 起動 ────────────────────────────────────────────────────────────────────

function startApp(){
  var sp = document.getElementById('splash');
  sp.classList.add('hide');
  setTimeout(function(){ sp.style.display='none'; }, 650);
}

loadAll();
render();
</script>
</body>
</html>
