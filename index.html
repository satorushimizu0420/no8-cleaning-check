<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>No.8 掃除チェック</title>
<link rel="apple-touch-icon" href="asanosouji-icon-180.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="asanosouji-icon-180.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="No.8掃除"/>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:"Hiragino Sans","Yu Gothic UI",sans-serif;background:linear-gradient(160deg,#eef8ff,#f0f8ff,#e8f6ff);min-height:100vh;color:#3a2a3a;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
button,input{font-family:inherit;}
input{outline:none;}
button{cursor:pointer;-webkit-appearance:none;}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* スプラッシュ */
#splash{position:fixed;inset:0;z-index:1000;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,transform .6s;cursor:pointer;user-select:none;}
#splash.hide{opacity:0;transform:scale(1.04);pointer-events:none;}
.sp-bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% -10%,rgba(247,168,208,.18),transparent 70%),radial-gradient(ellipse 40% 40% at 100% 100%,rgba(200,168,247,.12),transparent 60%);}
.sp-inner{position:relative;display:flex;flex-direction:column;align-items:center;animation:scaleIn .8s cubic-bezier(.16,1,.3,1) both;}
.sp-logo{width:96px;height:96px;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 40px rgba(200,100,180,.12),0 2px 8px rgba(0,0,0,.06);margin-bottom:28px;position:relative;overflow:hidden;}
.sp-logo::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.7) 50%,transparent 60%);animation:shimmer 2.4s ease-in-out infinite;}
.sp-brand{font-size:11px;letter-spacing:4px;color:#c0a8c0;font-weight:500;margin-bottom:10px;animation:fadeUp .8s .15s both;}
.sp-title{font-size:32px;font-weight:800;color:#2a1a2a;margin-bottom:6px;animation:fadeUp .8s .25s both;}
.sp-title span{background:linear-gradient(135deg,#4ab8e8,#89d4f5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sp-sub{font-size:13px;color:#b090b0;margin-bottom:48px;animation:fadeUp .8s .35s both;}
.sp-div{width:1px;height:36px;background:linear-gradient(to bottom,transparent,#e0c8e0,transparent);margin-bottom:48px;animation:fadeUp .8s .4s both;}
.sp-tap{display:flex;flex-direction:column;align-items:center;gap:10px;animation:fadeUp .8s .5s both;}
.sp-circle{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#89d4f5,#4ab8e8);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(200,100,200,.25);font-size:22px;}
.sp-tap-label{font-size:11px;letter-spacing:3px;color:#c0a0c0;font-weight:500;animation:pulse 2.4s ease-in-out 1s infinite;}
.sp-ver{position:absolute;bottom:28px;font-size:10px;color:#d0c0d0;letter-spacing:1px;}

/* ヘッダー */
.hdr{background:linear-gradient(135deg,#89d4f5,#4ab8e8);position:sticky;top:0;z-index:20;box-shadow:0 2px 16px rgba(200,100,200,.18);}
.hdr.pm{background:linear-gradient(135deg,#ff8c00,#ffb347);}
.hdr-in{max-width:800px;margin:0 auto;padding:12px 16px 0;display:flex;justify-content:space-between;align-items:flex-start;}
.hdr-title{font-size:18px;font-weight:800;color:#fff;}
.hdr-sub{font-size:10px;color:rgba(255,255,255,.75);letter-spacing:2px;font-weight:600;}
.mnav{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:20px;padding:6px 10px;}
.mnav button{background:none;border:none;color:#fff;font-size:20px;padding:0 6px;line-height:1;}
.mlabel{font-size:14px;font-weight:700;color:#fff;min-width:82px;text-align:center;}
.period-row{max-width:800px;margin:0 auto;display:flex;gap:8px;padding:10px 16px 4px;}
.pbtn{flex:1;border:none;border-radius:20px;padding:9px 0;font-weight:700;font-size:13px;background:rgba(255,255,255,.2);color:rgba(255,255,255,.85);}
.pbtn.act{background:rgba(255,255,255,.95);color:#0080c0;}
.pbtn.act.pm{color:#c05000;}
.tab-row{max-width:800px;margin:0 auto;display:flex;padding:4px 16px 0;}
.tbtn{background:none;border:none;color:rgba(255,255,255,.65);font-weight:600;font-size:14px;padding:8px 18px;border-bottom:3px solid transparent;}
.tbtn.act{color:#fff;border-bottom:3px solid #fff;}

/* メイン */
.main{max-width:800px;margin:0 auto;padding:16px 12px 80px;}

/* サマリー */
.sum-row{display:flex;gap:12px;margin-bottom:14px;}
.sum-card{flex:1;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 12px rgba(200,120,200,.1);}
.sum-num{font-size:26px;font-weight:800;line-height:1;}
.sum-label{font-size:11px;color:#c090c0;font-weight:600;margin-bottom:4px;}
.pbar{height:8px;background:#d8eef8;border-radius:4px;overflow:hidden;margin-top:6px;}
.pfill{height:100%;border-radius:4px;transition:width .4s;}
.sum-detail{font-size:11px;color:#b090c0;margin-top:4px;}

/* グリッド */
.grid-wrap{display:flex;background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(200,120,200,.1);overflow:hidden;margin-bottom:10px;}
.grid-left{flex-shrink:0;min-width:110px;max-width:130px;border-right:1.5px solid #f0e0f0;}
.grid-corner{height:52px;display:flex;align-items:flex-end;padding:0 8px 8px;font-size:10px;color:#80b8d8;font-weight:600;border-bottom:1.5px solid #f0e0f0;background:#fdf5ff;}
.grid-area{height:44px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:#006090;border-bottom:1px solid #f8f0f8;cursor:pointer;justify-content:space-between;overflow:hidden;}
.grid-area:hover{background:#fdf0ff;}
.grid-total-lbl{height:36px;display:flex;align-items:center;padding:0 8px;font-size:10px;color:#c090c0;font-weight:600;border-top:1.5px solid #f0e0f0;background:#fdf5ff;}
.grid-right{flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.grid-right::-webkit-scrollbar{height:3px;}
.grid-right::-webkit-scrollbar-thumb{background:#f0d0e8;border-radius:2px;}
.day-hdr-row{display:flex;border-bottom:1.5px solid #f0e0f0;background:#fdf5ff;}
.day-hdr{min-width:38px;width:38px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 7px;font-size:12px;font-weight:700;color:#7050a0;flex-shrink:0;border-right:1px solid #f8f0f8;}
.day-hdr.mon{background:#f5f0ff;color:#ccc;}
.day-hdr.sat{color:#5b7fe8;}
.day-hdr.sun{color:#e85b7f;}
.day-hdr.today-am{background:linear-gradient(180deg,#c8eeff,#a8d8f8);color:#007ab8;}
.day-hdr.today-pm{background:linear-gradient(180deg,#ffe0b0,#ffcc80);color:#c05000;}
.data-row{display:flex;border-bottom:1px solid #f8f0f8;}
.data-cell{min-width:38px;width:38px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-right:1px solid #f8f0f8;cursor:pointer;touch-action:manipulation;user-select:none;}
.data-cell:active{background:#fde8f8;}
.data-cell.mon{background:#f8f5ff;cursor:default;}
.data-cell.today-am{background:#e8f6ff;}
.data-cell.today-pm{background:#fff4e0;}
.checker-badge{font-size:7px;width:34px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;padding:0 2px;color:#fff;}
.total-row{display:flex;background:#fdf5ff;border-top:1.5px solid #f0e0f0;}
.total-cell{min-width:38px;width:38px;height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border-right:1px solid #f0e8f8;cursor:pointer;font-weight:700;font-size:10px;}
.total-cell.mon{cursor:default;}

/* オーバーレイ・シート */
.overlay{position:fixed;inset:0;background:rgba(60,20,80,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:540px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 -4px 40px rgba(180,100,200,.2);}
.sh-handle{width:36px;height:4px;background:#e0d0e8;border-radius:2px;margin:12px auto 0;flex-shrink:0;}
.sh-hdr{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px 14px;border-bottom:1px solid #f0e0f0;flex-shrink:0;}
.sh-title{font-size:17px;font-weight:800;color:#005a8e;}
.sh-sub{font-size:12px;color:#c090c0;margin-top:3px;}
.sh-close{background:#f5eeff;border:none;border-radius:50%;width:32px;height:32px;font-size:16px;color:#a060c0;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sh-body{overflow-y:auto;flex:1;}

/* 詳細シート アイテム */
.area-item{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid #f5eef5;cursor:pointer;gap:12px;touch-action:manipulation;user-select:none;}
.area-item:active{background:#fdf0f8;}
.area-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.area-name{font-size:15px;font-weight:600;flex:1;}
.area-badge{border-radius:16px;padding:5px 13px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;flex-shrink:0;}
.area-arrow{color:#ddd;font-size:20px;}

/* ピッカー */
.picker-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 20px;}
.pick-btn{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:30px;border:1.5px solid #e8e0f0;background:#fff;color:#555;font-size:15px;cursor:pointer;min-width:90px;transition:all .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;}
.pick-btn.on{color:#fff;font-weight:700;}
.pick-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.undo-wrap{padding:4px 20px 20px;}
.undo-btn{width:100%;padding:14px;border-radius:14px;border:1.5px dashed #e0c0d8;background:#fff;color:#c060a0;font-size:14px;font-weight:600;}

/* カード */
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(200,120,200,.08);}
.card-title{font-weight:700;font-size:14px;color:#0080c0;margin-bottom:12px;}
.input-s{border:1.5px solid #e8d0e8;border-radius:10px;padding:9px 13px;font-size:14px;color:#3a2a3a;background:#fdf8ff;width:100%;}
.btn-p{background:linear-gradient(135deg,#89d4f5,#4ab8e8);color:#fff;border:none;border-radius:12px;padding:12px 24px;font-size:14px;font-weight:700;width:100%;margin-top:10px;}
.btn-s{background:#f5e8fc;color:#a060c0;border:1.5px solid #d8b8f0;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;}
.btn-d{background:#fff0f4;color:#e06080;border:1.5px solid #f0c8d0;border-radius:8px;padding:8px 10px;font-size:13px;}
.idx{min-width:24px;text-align:center;color:#c090c0;font-weight:700;font-size:13px;}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.chip{padding:6px 13px;border-radius:16px;border:1.5px solid #e8c0d8;background:#fff5fa;color:#b06090;font-size:12px;font-weight:600;}
.chip.act{background:linear-gradient(135deg,#89d4f5,#4ab8e8);color:#fff;border-color:transparent;}

/* 集計ボタン */
.report-btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#89d4f5,#4ab8e8);color:#fff;border:none;border-radius:28px;padding:15px 40px;font-size:16px;font-weight:800;box-shadow:0 6px 24px rgba(200,100,200,.4);z-index:30;white-space:nowrap;}
.report-btn.pm{background:linear-gradient(135deg,#ff8c00,#ffb347);}

/* 集計シート */
.report-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:700px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -4px 40px rgba(180,100,200,.2);}
.canvas-wrap{padding:14px;overflow-y:auto;flex:1;}
#reportCanvas{width:100%;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.send-btn{background:linear-gradient(135deg,#89d4f5,#4ab8e8);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;width:100%;}

/* トースト */
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#89d4f5,#4ab8e8);color:#fff;border-radius:20px;padding:10px 24px;font-weight:700;font-size:14px;z-index:999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(200,100,200,.3);}

/* テーブル */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#fdf0f8;padding:8px 10px;border:1px solid #f0d8ec;font-weight:700;color:#a04080;text-align:left;}
td{padding:8px 10px;border:1px solid #f5eef5;color:#555;}
.save-banner{background:linear-gradient(90deg,#d8f0ff,#e8f8ff);border:1.5px solid #a8d8f0;border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:8px;font-size:12px;color:#8050a0;font-weight:600;}
</style>
</head>
<body>

<!-- スプラッシュ -->
<div id="splash" onclick="startApp()">
  <div class="sp-bg"></div>
  <div class="sp-inner">
    <div class="sp-logo"><span style="font-size:44px">✂</span></div>
    <div class="sp-brand">SALON CLEAN CHECK</div>
    <div class="sp-title">No.<span>8</span></div>
    <div class="sp-sub">掃除チェック管理システム</div>
    <div class="sp-div"></div>
    <div class="sp-tap">
      <div class="sp-circle">→</div>
      <div class="sp-tap-label">TAP TO START</div>
    </div>
  </div>
  <div class="sp-ver">ver 3.0</div>
</div>

<div id="app"></div>

<script>
// ─── 初期データ ────────────────────────────────────────────────────────────────
var DEF_SHOP="霧島店";
var DEF_STAFF=["スタッフ1","スタッフ2","スタッフ3","スタッフ4","スタッフ5","スタッフ6","スタッフ7","スタッフ8"];
var DEF_AREAS=[
  {name:"カットフロアー", items:["床掃き","床拭き","鏡拭き","セット椅子清掃","カウンター拭き"]},
  {name:"シャンプーエリア",items:["シャンプー台洗い","シャンプールーム整理","シャンプー補充","イヤーカバー洗い"]},
  {name:"ラボ",            items:["ラボ整理","シンク掃除","カラーパーマ準備"]},
  {name:"バックルーム",    items:["バックルーム整理","バックルームシンク","クロス洗濯"]},
  {name:"待合・受付",      items:["待合整頓","雑誌整理","カウンター拭き","伝票準備"]},
  {name:"トイレ",          items:["お客様トイレ","スタッフトイレ"]},
  {name:"外・駐車場",      items:["駐車場清掃","店前掃き","ゴミ捨て場"]},
  {name:"環境整備",        items:["環境整備サイン"]}
];
var DEF_PM=["イヤーカバー","シャンプー台洗い","シャンプールーム整理","シャンプー補充","クロス洗濯","ラボ整理・シンク","雑誌整理","バックルーム整理","バックルームシンク","カラーパーマ準備","カルテ・伝票準備","環境整備サイン"];
var COLORS=["#e8405a","#f0921e","#2db060","#2090d0","#7060d0","#e07030","#c030a0","#30a898"];
var DOW=["日","月","火","水","木","金","土"];
var SEND_TO="satorushimizu0420@icloud.com";

// ─── ストレージ ────────────────────────────────────────────────────────────────
function lg(k){try{var v=localStorage.getItem("no8v3_"+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function ls(k,v){try{localStorage.setItem("no8v3_"+k,JSON.stringify(v));}catch(e){}}

// ─── 状態 ──────────────────────────────────────────────────────────────────────
var now=new Date();
var S={
  year:now.getFullYear(), month:now.getMonth()+1,
  tab:"check", period:"am",
  shopName:lg("shopName")||DEF_SHOP,
  staff:lg("staff")||DEF_STAFF.slice(),
  areasAm:lg("areasAm")||JSON.parse(JSON.stringify(DEF_AREAS)),
  tasksPm:lg("tasksPm")||DEF_PM.slice(),
  checks:lg("checks")||{am:{},pm:{}},
  detailDay:null,
  picker:null,
  editAi:null,
  showReport:false,
  toast:null, toastTimer:null
};

// ─── ヘルパー ──────────────────────────────────────────────────────────────────
function dim(y,m){return new Date(y,m,0).getDate();}
function dw(y,m,d){return new Date(y,m-1,d).getDay();}
function isMon(y,m,d){return dw(y,m,d)===1;}
function p2(n){return n<10?"0"+n:String(n);}
function ds(y,m,d){return y+"-"+p2(m)+"-"+p2(d);}
function tdStr(){var n=new Date();return ds(n.getFullYear(),n.getMonth()+1,n.getDate());}
function pct(d,t){return t?Math.round(d/t*100):0;}
function ast(){return S.staff.filter(function(s){return s&&s.trim();});}
function getC(period,dateStr){
  if(!S.checks[period]||!S.checks[period][dateStr])return {};
  return S.checks[period][dateStr]||{};
}

// ─── チェック操作 ──────────────────────────────────────────────────────────────
function toggle(period,dateStr,key,name){
  if(!S.checks[period])S.checks[period]={};
  if(!S.checks[period][dateStr])S.checks[period][dateStr]={};
  var cur=S.checks[period][dateStr][key];
  S.checks[period][dateStr][key]=(cur===name)?null:name;
  ls("checks",S.checks);
  // 即座に閉じてから非同期で再描画（レスポンス改善）
  S.picker=null;
  S.detailDay=null;
  requestAnimationFrame(function(){ render(); });
}

// ─── 達成計算 ──────────────────────────────────────────────────────────────────
function amDone(d){
  var c=getC("am",ds(S.year,S.month,d));
  var done=0;
  for(var i=0;i<S.areasAm.length;i++){if(c[String(i)])done++;}
  return {done:done,total:S.areasAm.length};
}
function pmDone(d){
  var c=getC("pm",ds(S.year,S.month,d));
  return {done:S.tasksPm.filter(function(_,i){return c[String(i)];}).length,total:S.tasksPm.length};
}
function curDone(d){return S.period==="am"?amDone(d):pmDone(d);}
function monthTotal(period){
  var done=0,total=0,days=dim(S.year,S.month);
  for(var d=1;d<=days;d++){
    if(isMon(S.year,S.month,d))continue;
    var r=period==="am"?amDone(d):pmDone(d);
    done+=r.done;total+=r.total;
  }
  return {done:done,total:total};
}

// ─── トースト ──────────────────────────────────────────────────────────────────
function showToast(msg){
  if(S.toastTimer)clearTimeout(S.toastTimer);
  S.toast=msg;
  S.toastTimer=setTimeout(function(){S.toast=null;render();},2500);
  render();
}

// ─── 集計Canvas描画 ────────────────────────────────────────────────────────────
function drawReport(canvas){
  var days=dim(S.year,S.month);
  var staffList=ast();
  var W=canvas.width=680;
  var rowH=26;
  var workDays=0;
  for(var d=1;d<=days;d++){if(!isMon(S.year,S.month,d))workDays++;}
  var H=120+80+(workDays+1)*rowH+20+(staffList.length>0?40+(staffList.length+1)*rowH+20:0)+30;
  canvas.height=H;
  var ctx=canvas.getContext("2d");

  // 背景
  ctx.fillStyle="#fafafa";ctx.fillRect(0,0,W,H);

  // ヘッダー
  var hg=ctx.createLinearGradient(0,0,W,0);
  hg.addColorStop(0,"#89d4f5");hg.addColorStop(1,"#4ab8e8");
  ctx.fillStyle=hg;ctx.fillRect(0,0,W,70);
  ctx.fillStyle="#fff";
  ctx.font="bold 24px 'Hiragino Sans',sans-serif";
  ctx.fillText("✂ No.8 掃除チェック集計",20,40);
  ctx.font="13px 'Hiragino Sans',sans-serif";
  ctx.fillStyle="rgba(255,255,255,.85)";
  ctx.fillText(S.shopName+"　"+S.year+"年"+S.month+"月　送信: "+new Date().toLocaleString("ja-JP"),20,60);

  var y=80;

  // 月間サマリー
  ctx.fillStyle="#fff";
  roundRect(ctx,12,y,W-24,72,10);ctx.fill();
  var am=monthTotal("am"),pm=monthTotal("pm");
  var pA=pct(am.done,am.total),pP=pct(pm.done,pm.total);

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function drawBar(ctx,label,val,color,x,y,bw){
  ctx.fillStyle="#555";ctx.font="12px 'Hiragino Sans',sans-serif";ctx.fillText(label,x,y);
  ctx.fillStyle="#f0e0f0";roundRect(ctx,x,y+6,bw,10,5);ctx.fill();
  ctx.fillStyle=color;roundRect(ctx,x,y+6,bw*val/100,10,5);ctx.fill();
  ctx.fillStyle=color;ctx.font="bold 13px 'Hiragino Sans',sans-serif";
  ctx.fillText(val+"%",x+bw+8,y+16);
}
function drawTableHeader(ctx,cols,cw,x,y,w,h){
  ctx.fillStyle="#fdf0f8";ctx.fillRect(x,y,w,h);
  ctx.fillStyle="#a04080";ctx.font="bold 12px 'Hiragino Sans',sans-serif";
  var tx=x+6;
  for(var i=0;i<cols.length;i++){ctx.fillText(cols[i],tx,y+h-8);tx+=cw[i];}
}

function sendReport(){
  var canvas=document.getElementById("reportCanvas");
  if(!canvas)return;
  drawReport(canvas);

  // ボタンをローディング表示
  var sendBtn=document.querySelector(".send-btn");
  if(sendBtn){sendBtn.textContent="送信中...";sendBtn.disabled=true;}

  // Canvas→Base64
  var imgData=canvas.toDataURL("image/png");

  // テキスト集計も作成
  var days=dim(S.year,S.month);
  var am=monthTotal("am"),pm=monthTotal("pm");
  var pA=pct(am.done,am.total),pP=pct(pm.done,pm.total);
  var bothD=am.done+pm.done,bothT=am.total+pm.total,pB=pct(bothD,bothT);
  var msg="【"+S.year+"年"+S.month+"月 掃除チェック集計】\n";
  msg+="店舗: "+S.shopName+"\n";
  msg+="送信日時: "+new Date().toLocaleString("ja-JP")+"\n\n";
  msg+="■ 月間達成率\n";
  msg+="  朝:   "+am.done+"/"+am.total+" ("+pA+"%)\n";
  msg+="  夕方: "+pm.done+"/"+pm.total+" ("+pP+"%)\n";
  msg+="  合計: "+bothD+"/"+bothT+" ("+pB+"%)\n\n";

  // スタッフ別
  var staffList=ast();
  if(staffList.length>0){
    msg+="■ スタッフ別実績\n";
    staffList.forEach(function(name){
      var ac=0,at=0,pc2=0,pt=0;
      for(var d=1;d<=days;d++){
        if(isMon(S.year,S.month,d))continue;
        var dStr=ds(S.year,S.month,d);
        var ca=getC("am",dStr);
        for(var ai=0;ai<S.areasAm.length;ai++){at++;if(ca[String(ai)]===name)ac++;}
        var cp=getC("pm",dStr);
        for(var ti=0;ti<S.tasksPm.length;ti++){pt++;if(cp[String(ti)]===name)pc2++;}
      }
      var tot=ac+pc2,gt=at+pt,sp=pct(tot,gt);
      var bar="";for(var b=0;b<10;b++){bar+=b<Math.round(sp/10)?"#":".";}
      msg+="  "+name+": "+bar+" "+sp+"%\n";
    });
  }
  msg+="\n--- No.8 掃除チェックアプリ ---";

  // EmailJS REST API
  var payload=JSON.stringify({
    service_id:"service_no8",
    template_id:"template_ej9ifzr",
    user_id:"SDiiHZe2UZvk7kFux",
    template_params:{
      subject:S.year+"年"+S.month+"月 掃除チェック集計 - No.8 "+S.shopName,
      from_name:"No.8 "+S.shopName,
      from_email:SEND_TO,
      to_name:"管理者",
      to_email:SEND_TO,
      reply_to:SEND_TO,
      name:"No.8 "+S.shopName,
      email:SEND_TO,
      message:msg,
      title:S.year+"年"+S.month+"月 集計"
    }
  });
  var xhr=new XMLHttpRequest();
  xhr.open("POST","https://api.emailjs.com/api/v1.0/email/send");
  xhr.setRequestHeader("Content-Type","application/json");
  xhr.onload=function(){
    if(xhr.status===200){
      showToast("メールを送信しました！");
      S.showReport=false;render();
    }else{
      showToast("送信失敗("+xhr.status+")。再度お試しください");
      if(sendBtn){sendBtn.textContent="メールを送信する";sendBtn.disabled=false;}
    }
  };
  xhr.onerror=function(){
    showToast("通信エラー。再度お試しください");
    if(sendBtn){sendBtn.textContent="メールを送信する";sendBtn.disabled=false;}
  };
  xhr.send(payload);
}

        tr3.appendChild(td3);tr3.appendChild(td4);
      }else{
        var ar=amDone(d),pr=pmDone(d);
        var pA2=pct(ar.done,ar.total),pP2=pct(pr.done,pr.total);
        var bd=ar.done+pr.done,bt=ar.total+pr.total,pB2=pct(bd,bt);
        [d+"日("+DOW[dw(S.year,S.month,d)]+")",pA2+"%",pP2+"%"].forEach(function(t,ci){
          var td5=el("td");td5.textContent=t;
          if(ci===1&&pA2===100)td5.style.color="#c060a0";
          if(ci===2&&pP2===100)td5.style.color="#c07800";
          tr3.appendChild(td5);
        });
        var tdB=el("td");
        var bwD=el("div","","display:flex;align-items:center;gap:4px;");
        var btD=el("div","","flex:1;height:7px;background:#f0e8f8;border-radius:4px;min-width:40px;");
        var bfD=el("div","","height:100%;border-radius:4px;");
        bfD.style.width=pB2+"%";
        bfD.style.background=pB2===100?"linear-gradient(135deg,#89d4f5,#4ab8e8)":"#d0c0e8";
        btD.appendChild(bfD);
        var ps=el("span","","font-size:11px;font-weight:700;min-width:32px;");
        ps.style.color=pB2===100?"#c060a0":"#a080b0";ps.textContent=pB2+"%";
        bwD.appendChild(btD);bwD.appendChild(ps);tdB.appendChild(bwD);tr3.appendChild(tdB);
        tr3.style.cursor="pointer";
        (function(d4){tr3.onclick=function(){S.tab="check";S.detailDay=d4;render();};})(d);
      }
      tbody.appendChild(tr3);
    }
    table.appendChild(tbody);tbl.appendChild(table);h2.appendChild(tbl);main.appendChild(h2);
  }

  // ── 設定タブ ──────────────────────────────────────────────────────────────────
  if(S.tab==="settings"){
    main.appendChild(el("div","save-banner")).innerHTML="💾 設定データは自動保存されます";

    // 店舗名
    var sc1=el("div","card");sc1.appendChild(el("div","card-title")).appendChild(tx("🏪 店舗名"));
    var si1=el("input");si1.type="text";si1.className="input-s";si1.value=S.shopName;
    si1.oninput=function(){S.shopName=this.value;ls("shopName",S.shopName);};
    sc1.appendChild(si1);main.appendChild(sc1);

    // スタッフ
    var sc2=el("div","card");sc2.appendChild(el("div","card-title")).appendChild(tx("👤 スタッフ名（最大8名）"));
    for(var ni=0;ni<8;ni++){
      var row=el("div","row");
      var idx2=el("span","idx");idx2.textContent=ni+1;
      var sinp=el("input");sinp.type="text";sinp.className="input-s";sinp.style.flex="1";
      sinp.placeholder="スタッフ"+(ni+1)+"（空欄は非表示）";sinp.value=S.staff[ni]||"";
      (function(ni2){sinp.oninput=function(){S.staff[ni2]=this.value;ls("staff",S.staff);};})(ni);
      row.appendChild(idx2);row.appendChild(sinp);sc2.appendChild(row);
    }
    main.appendChild(sc2);

    // 朝の掃除場所
    var sc3=el("div","card");
    var sc3t=el("div","","display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;");
    var sc3tl=el("div","card-title","margin-bottom:0;");sc3tl.textContent="🌅 朝の掃除場所";
    var sc3a=el("button","btn-s");sc3a.textContent="＋追加";
    sc3a.onclick=function(){S.areasAm.push({name:"新しい場所",items:[""]});ls("areasAm",S.areasAm);render();};
    sc3t.appendChild(sc3tl);sc3t.appendChild(sc3a);sc3.appendChild(sc3t);
    S.areasAm.forEach(function(area,i){
      var row=el("div","row");
      var idx3=el("span","idx");idx3.textContent=i+1;
      var abtn=el("button","","border:1.5px solid #e8d0e8;border-radius:10px;padding:8px 12px;font-size:13px;color:#7050a0;background:#fdf5ff;flex:1;text-align:left;cursor:pointer;");
      abtn.textContent=area.name+"（"+area.items.length+"項目）";
      (function(i2){abtn.onclick=function(){S.editAi=i2;render();};})(i);
      var del=el("button","btn-d");del.textContent="✕";
      (function(i2){del.onclick=function(){S.areasAm.splice(i2,1);ls("areasAm",S.areasAm);render();};})(i);
      row.appendChild(idx3);row.appendChild(abtn);row.appendChild(del);sc3.appendChild(row);
    });
    main.appendChild(sc3);

    // 夕方
    var sc4=el("div","card");
    var sc4t=el("div","","display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;");
    var sc4tl=el("div","card-title","margin-bottom:0;");sc4tl.textContent="🌆 夕方の掃除箇所";
    var sc4a=el("button","btn-s");sc4a.textContent="＋追加";
    sc4a.onclick=function(){S.tasksPm.push("");ls("tasksPm",S.tasksPm);render();};
    sc4t.appendChild(sc4tl);sc4t.appendChild(sc4a);sc4.appendChild(sc4t);
    S.tasksPm.forEach(function(t,i){
      var row=el("div","row");
      var idx4=el("span","idx");idx4.textContent=i+1;
      var ti=el("input");ti.type="text";ti.className="input-s";ti.style.flex="1";ti.value=t;
      (function(i2){ti.oninput=function(){S.tasksPm[i2]=this.value;ls("tasksPm",S.tasksPm);};})(i);
      var del=el("button","btn-d");del.textContent="✕";
      (function(i2){del.onclick=function(){S.tasksPm.splice(i2,1);ls("tasksPm",S.tasksPm);render();};})(i);
      row.appendChild(idx4);row.appendChild(ti);row.appendChild(del);sc4.appendChild(row);
    });
    main.appendChild(sc4);
  }

  root.appendChild(main);

  // 集計ボタン
  if(S.tab==="check"||S.tab==="history"){
    var rb=el("button","report-btn"+(isPm?" pm":""));
    rb.textContent="📊 集計を送信";
    rb.onclick=function(){S.showReport=true;render();};
    root.appendChild(rb);
  }

  // ── 掃除場所編集シート ────────────────────────────────────────────────────────
  if(S.editAi!==null&&S.areasAm[S.editAi]){
    var area=S.areasAm[S.editAi];
    var ov=el("div","overlay");
    ov.onclick=function(){S.editAi=null;render();};
    var sh=el("div","sheet");sh.onclick=function(e){e.stopPropagation();};
    sh.appendChild(el("div","sh-handle"));
    var shh=el("div","sh-hdr");
    var sht=el("div","sh-title");sht.textContent="掃除場所の編集";shh.appendChild(sht);
    var sc=el("button","sh-close");sc.textContent="✕";sc.onclick=function(){S.editAi=null;render();};
    shh.appendChild(sc);sh.appendChild(shh);
    var shb=el("div","sh-body","padding:16px 20px;");
    var nl=el("div","","font-size:12px;color:#c080c0;font-weight:600;margin-bottom:6px;");nl.textContent="場所名";
    var ni=el("input");ni.type="text";ni.className="input-s";ni.style.marginBottom="16px";ni.value=area.name;
    ni.oninput=function(){S.areasAm[S.editAi].name=this.value;ls("areasAm",S.areasAm);};
    shb.appendChild(nl);shb.appendChild(ni);
    var il=el("div","","font-size:12px;color:#c080c0;font-weight:600;margin-bottom:8px;");il.textContent="掃除内容";
    shb.appendChild(il);
    area.items.forEach(function(item,ii){
      var row=el("div","row");
      var idx5=el("span","idx");idx5.textContent=ii+1;
      var iinp=el("input");iinp.type="text";iinp.className="input-s";iinp.style.flex="1";iinp.value=item;
      (function(ii2){iinp.oninput=function(){S.areasAm[S.editAi].items[ii2]=this.value;ls("areasAm",S.areasAm);};})(ii);
      var idel=el("button","btn-d");idel.textContent="✕";
      (function(ii2){idel.onclick=function(){S.areasAm[S.editAi].items.splice(ii2,1);ls("areasAm",S.areasAm);render();};})(ii);
      row.appendChild(idx5);row.appendChild(iinp);row.appendChild(idel);shb.appendChild(row);
    });
    var addI=el("button","btn-s","width:100%;margin-top:8px;padding:10px;");
    addI.textContent="＋ 掃除内容を追加";
    addI.onclick=function(){S.areasAm[S.editAi].items.push("");ls("areasAm",S.areasAm);render();};
    shb.appendChild(addI);sh.appendChild(shb);ov.appendChild(sh);root.appendChild(ov);
  }

  // ── 日付詳細シート（合計行タップ） ───────────────────────────────────────────
  if(S.detailDay!==null){
    var dDs=ds(S.year,S.month,S.detailDay);
    var dAmC=getC("am",dDs),dPmC=getC("pm",dDs);
    var dHol=isMon(S.year,S.month,S.detailDay);
    var ov2=el("div","overlay");
    ov2.onclick=function(){S.detailDay=null;S.picker=null;render();};
    var sh2=el("div","sheet");sh2.onclick=function(e){e.stopPropagation();};
    sh2.appendChild(el("div","sh-handle"));
    var shh2=el("div","sh-hdr");
    var shInfo=el("div");
    var shSub=el("div","sh-sub");shSub.textContent=S.shopName+"　"+(isPm?"夕方の掃除":"朝の掃除");
    var shT2=el("div","sh-title");shT2.textContent=S.month+"月"+S.detailDay+"日（"+DOW[dw(S.year,S.month,S.detailDay)]+"）";
    shInfo.appendChild(shSub);shInfo.appendChild(shT2);shh2.appendChild(shInfo);
    var sc2=el("button","sh-close");sc2.textContent="✕";
    sc2.onclick=function(){S.detailDay=null;S.picker=null;render();};
    shh2.appendChild(sc2);sh2.appendChild(shh2);

    if(dHol){
      var hd=el("div","","text-align:center;padding:32px;");
      hd.innerHTML="<div style='font-size:36px'>🌙</div><div style='font-weight:700;font-size:16px;margin-top:8px;color:#9070b0'>定休日</div>";
      sh2.appendChild(hd);
    }else{
      var shb2=el("div","sh-body");
      var dR=isPm?pmDone(S.detailDay):amDone(S.detailDay);
      var dP=pct(dR.done,dR.total);
      var pb=el("div","","padding:12px 20px;border-bottom:1px solid #f0e8f8;");
      var pbt=el("div","","display:flex;justify-content:space-between;margin-bottom:6px;");
      var pbl=el("span","","font-size:13px;color:#9070b0;font-weight:600;");pbl.textContent="進捗";
      var pbr=el("span","","font-size:14px;font-weight:700;");pbr.style.color=col;pbr.textContent=dR.done+"/"+dR.total+"  "+dP+"%";
      pbt.appendChild(pbl);pbt.appendChild(pbr);pb.appendChild(pbt);
      var pbw=el("div","pbar");var pbf=el("div","pfill");pbf.style.background=fill;pbf.style.width=dP+"%";pbw.appendChild(pbf);pb.appendChild(pbw);
      if(dR.done===dR.total&&dR.total>0){var cplt=el("div","","text-align:center;color:"+col+";font-weight:700;margin-top:8px;");cplt.textContent="🎉 完了！";pb.appendChild(cplt);}
      shb2.appendChild(pb);

      var listItems=isPm?S.tasksPm:S.areasAm;
      listItems.forEach(function(item,idx){
        var nm=isPm?item:item.name;
        var checker=isPm?(dPmC[String(idx)]||null):(dAmC[String(idx)]||null);
        var sc3=checker?COLORS[staffList.indexOf(checker)%COLORS.length]:"#e0d0e8";
        var li=el("div","area-item");
        var dot=el("div","area-dot");dot.style.background=checker?sc3:"#e0d0e8";
        var anm=el("div","area-name");anm.style.color=checker?"#6040a0":"#444";anm.textContent=nm;
        li.appendChild(dot);li.appendChild(anm);
        if(checker){var bdg=el("div","area-badge");bdg.style.background=sc3;bdg.textContent=checker;li.appendChild(bdg);}
        else{var arw=el("div","area-arrow");arw.textContent="›";li.appendChild(arw);}
        (function(idx2,nm2,ck2,dStr2){
          li.onclick=function(){
            S.picker={pm:isPm,idx:idx2,label:nm2,checker:ck2,dateStr:dStr2,day:S.detailDay};
            render();
          };
        })(idx,nm,checker,dDs);
        shb2.appendChild(li);
      });
      sh2.appendChild(shb2);
    }
    ov2.appendChild(sh2);root.appendChild(ov2);
  }

  // ── スタッフピッカー ───────────────────────────────────────────────────────────
  if(S.picker!==null){
    var pk=S.picker;
    var ov3=el("div","overlay");ov3.style.zIndex="60";
    ov3.onclick=function(){S.picker=null;render();};
    var sh3=el("div","sheet");sh3.style.paddingBottom="28px";sh3.onclick=function(e){e.stopPropagation();};
    sh3.appendChild(el("div","sh-handle"));
    var shh3=el("div","sh-hdr");
    var shT3=el("div","sh-title");shT3.textContent=(pk.label||"")+"　"+S.month+"/"+pk.day;
    var shS3=el("div","sh-sub");shS3.textContent="担当したスタッフを選んでください";
    shh3.appendChild(shT3);shh3.appendChild(shS3);sh3.appendChild(shh3);
    var pg=el("div","picker-grid");
    staffList.forEach(function(s,idx){
      var sc4=COLORS[idx%COLORS.length];
      var isOn=(pk.checker===s);
      var btn=el("div","pick-btn"+(isOn?" on":""));
      if(isOn)btn.style.background=sc4;
      btn.style.borderColor=isOn?sc4:"#e8e0f0";
      var dot=el("div","pick-dot");dot.style.background=isOn?"rgba(255,255,255,.7)":sc4;
      btn.appendChild(dot);btn.appendChild(tx(s));
      (function(s2){
        function doToggle(e){
          e.preventDefault();
          e.stopPropagation();
          toggle(pk.pm?"pm":"am",pk.dateStr,String(pk.idx),s2);
        }
        btn.addEventListener("touchend",doToggle,{passive:false});
        btn.addEventListener("click",doToggle);
      })(s);
      pg.appendChild(btn);
    });
    sh3.appendChild(pg);
    if(pk.checker){
      var uw=el("div","undo-wrap");
      var ub=el("button","undo-btn");ub.textContent="未実施に戻す";
      (function(pk2){
        (function(pk3){
          function doUndo(e){
            e.preventDefault();
            e.stopPropagation();
            toggle(pk3.pm?"pm":"am",pk3.dateStr,String(pk3.idx),pk3.checker);
          }
          ub.addEventListener("touchend",doUndo,{passive:false});
          ub.addEventListener("click",doUndo);
        })(pk2);
      })(pk);
      uw.appendChild(ub);sh3.appendChild(uw);
    }
    ov3.appendChild(sh3);root.appendChild(ov3);
  }

  // ── 集計レポートシート ─────────────────────────────────────────────────────────
  if(S.showReport){
    var ov4=el("div","overlay");ov4.style.zIndex="70";
    ov4.onclick=function(){S.showReport=false;render();};
    var rsh=el("div","report-sheet");rsh.onclick=function(e){e.stopPropagation();};
    rsh.appendChild(el("div","sh-handle"));
    var rshh=el("div","sh-hdr");
    var rsht=el("div","sh-title");rsht.textContent="📊 集計レポート";rshh.appendChild(rsht);
    var rshs=el("div","sh-sub");rshs.textContent=S.shopName+" "+S.year+"年"+S.month+"月 → "+SEND_TO;rshh.appendChild(rshs);
    rsh.appendChild(rshh);
    var rcw=el("div","canvas-wrap");
    var canvas=document.createElement("canvas");canvas.id="reportCanvas";
    rcw.appendChild(canvas);rsh.appendChild(rcw);
    var rf=el("div","","padding:12px 16px;border-top:1px solid #f0e0f0;display:flex;gap:8px;flex-shrink:0;");
    var closeB=el("button","btn-s","flex:1;padding:12px 0;");closeB.textContent="閉じる";
    closeB.onclick=function(){S.showReport=false;render();};
    var sendB=el("button","send-btn","flex:2;");sendB.textContent="📧 メールを送信する";
    sendB.onclick=sendReport;
    rf.appendChild(closeB);rf.appendChild(sendB);rsh.appendChild(rf);
    ov4.appendChild(rsh);root.appendChild(ov4);
  }

  // トースト
  if(S.toast){var tst=el("div","toast");tst.textContent=S.toast;root.appendChild(tst);}

  // DOM更新
  document.getElementById("app").replaceWith(root);

  // グリッドスクロール復元
  var gr2=root.querySelector(".grid-right");
  if(gr2){
    gr2.scrollLeft=_sx;
    if(_sx===0){
      var todayEl=gr2.querySelector(".today-am,.today-pm");
      if(todayEl)todayEl.scrollIntoView({behavior:"auto",inline:"center"});
    }
  }

  // Canvas描画
  if(S.showReport){
    var cv=document.getElementById("reportCanvas");
    if(cv)drawReport(cv);
  }
}

function startApp(){
  var sp=document.getElementById("splash");
  sp.classList.add("hide");
  setTimeout(function(){sp.style.display="none";},650);
}

render();
</script>
</body>
</html>
